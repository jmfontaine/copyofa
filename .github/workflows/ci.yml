name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The publish workflow runs every check on the tagged commit before releasing.
  workflow_call:

permissions:
  contents: read

# A pull request's runs share its ref, so a newer push cancels the older run.
# Every other run gets a group of its own commit, so no `main` commit is left
# without a result: a group holds only one pending run, so even
# `cancel-in-progress: false` would drop the middle one of three quick pushes.
# github.workflow keeps a release run (called from "Publish") apart from the
# `main` run of the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Whether a pull request changes only files that cannot affect the build, the
  # tests or the distributions, so `build`, `test`, `wheel` and `sdist` can
  # skip. A workflow-level `paths-ignore` would skip `CI passed` too, the
  # required check, and the pull request could not merge. Pushes to `main` and
  # the publish workflow's call skip this job, and every job runs.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      # A pull request's run checks out the merge of its head into its base;
      # depth 2 fetches both parents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Prints docs-only=true only when every changed path is on the list below,
      # its one place. Any failure ends the step before it prints anything, so
      # the gated jobs run.
      - id: classify
        name: List the changed files
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Diff the merge against its base parent, and only if its other
          # parent is the pull request's head. --no-renames lists both sides of
          # a rename, so moving a file into docs/ still counts its old path.
          test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
          git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          docs_only=false
          while IFS= read -r -d '' path; do
            case $path in
              # Project documents: in neither distribution, and read by no
              # test, script or build step. Lint checks their Markdown and
              # spelling.
              docs/*) docs_only=true ;;
              # cspell's word list, read only by the cspell hook in lint.
              cspell.json) docs_only=true ;;
              # Guidance for agents and contributors: in neither distribution,
              # and read by no test, script or build step. (README.md is not
              # here: it is the package's readme, in the sdist and checked by
              # twine.)
              AGENTS.md | CONTRIBUTING.md) docs_only=true ;;
              *) docs_only=false; break ;;
            esac
          done < "$RUNNER_TEMP/changed"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Jobs on the same Python otherwise compute the same cache key and
          # race to reserve it, which logs a warning in whichever loses.
          cache-suffix: ${{ github.job }}
      - run: uv sync --locked
      # The one list of checks, shared with `just qa` and the git hooks. Hooks
      # that fix files fail here when they change something, and the diff shows
      # what they changed.
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Verify public API type completeness
        run: uv run pyright --ignoreexternal --verifytypes copyofa

  # The jobs a pull request that changes only documentation skips. !cancelled()
  # runs them when `changes` is skipped (not a pull request) or failed. A job
  # without a status check in its `if` skips whenever any job it depends on,
  # even indirectly, is skipped or failed, so `wheel` and `sdist` check
  # `build`'s result instead: they run when it succeeded and the run was not
  # canceled.
  test:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        resolution: [highest]
        include:
          # The oldest dependency versions pyproject.toml allows, on the oldest
          # and newest Python. Deprecations are fatal there, so an old
          # dependency calling an API Python deprecates fails here rather than
          # when that API is removed.
          - python: "3.11"
            resolution: lowest-direct
            warnings: -W error::DeprecationWarning -W error::PendingDeprecationWarning
          - python: "3.15"
            resolution: lowest-direct
            warnings: -W error::DeprecationWarning -W error::PendingDeprecationWarning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          cache-suffix: ${{ github.job }}-${{ matrix.resolution }}
      # Only the test group, so the suite cannot lean on a dev tool. The
      # lowest-direct resolution rewrites uv.lock in the runner; the highest
      # one installs exactly what uv.lock pins.
      - run: >-
          uv sync --no-dev --group test
          ${{ matrix.resolution == 'lowest-direct' && '--resolution lowest-direct' || '--locked' }}
      # --no-sync: a plain `uv run` would sync the dev group back in, and would
      # re-resolve a lowest-direct lock to the newest versions.
      - run: uv run --no-sync python ${{ matrix.warnings }} -m pytest --cov

  build:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          cache-suffix: ${{ github.job }}
      - run: uv build
      - name: Check distribution contents
        run: uv run --no-project python scripts/check_distributions.py dist
      # twine comes from uv.lock, so a new release reaches CI through
      # Dependabot's lock update. --only-dev installs the dev group without the
      # project, which this job only builds.
      - name: Check distribution metadata
        run: uv run --locked --only-dev twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The tests above run from the source tree. These install what would be
  # published into clean environments, resolving dependencies from the package
  # metadata instead of uv.lock, and test that.
  wheel:
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          cache-suffix: ${{ github.job }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Install the wheel with pip
        run: |
          uv venv --python ${{ matrix.python }} --seed /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install --quiet dist/*.whl
          /tmp/wheel-env/bin/python -m pip check
      # Before the test group lands, so nothing masks what the wheel resolved.
      - name: Check the installed package
        run: /tmp/wheel-env/bin/python scripts/check_installed_package.py
      - name: Install the test group
        run: |
          uv export --frozen --only-group test --no-hashes --no-emit-project -o /tmp/test-requirements.txt
          /tmp/wheel-env/bin/python -m pip install --quiet -r /tmp/test-requirements.txt
          /tmp/wheel-env/bin/python -m pip check
      - name: Run the test suite against the installed wheel
        run: /tmp/wheel-env/bin/python -m pytest

  sdist:
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.15"
          cache-suffix: ${{ github.job }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Build and install the sdist with pip
        run: |
          uv venv --python 3.15 --seed /tmp/sdist-env
          /tmp/sdist-env/bin/python -m pip install --quiet dist/*.tar.gz
          /tmp/sdist-env/bin/python -m pip check
      - name: Check the installed package
        run: /tmp/sdist-env/bin/python scripts/check_installed_package.py

  # The one status check `main` requires. It needs every job above, so adding,
  # renaming or resizing a job (or a matrix) never touches the ruleset. Keep its
  # `needs` in step with the jobs. A skipped job counts as passed, such as the
  # jobs a documentation-only pull request skips.
  ci-passed:
    name: CI passed
    needs: [build, changes, lint, sdist, test, wheel]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Fail unless every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
