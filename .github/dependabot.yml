version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Scopeless Conventional Commits: "build: bump ...". Both labels are in the
    # baseline every repository has.
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "build"
    groups:
      actions:
        patterns:
          - "*"
  # The uv ecosystem updates uv.lock. The pip one would leave it stale, failing
  # CI's `uv sync --locked`.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Minimum versions in pyproject.toml are deliberate, so only the lock moves.
    versioning-strategy: "lockfile-only"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "build"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
